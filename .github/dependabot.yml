---
# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This file was deleted by accident in 478105c (the nicegui -> React rewrite)
# on 2026-07-01, so no version updates ran for a month while CVEs were being
# patched by hand. The npm entry covers the frontend that same commit added,
# which never had coverage at all.
#
# Security updates are separate and always run regardless of what's listed
# here; these entries are the routine version bumps.
version: 2
updates:
  # Python — uv resolves from pyproject.toml and writes uv.lock.
  #
  # Batch all Python dependency updates into a single PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns: ['*']

  # React frontend.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns: ['*']
    ignore:
      # Hold typescript on the 5.x line. `make api-schema` regenerates the
      # typed client with openapi-typescript, which drives the TypeScript
      # *compiler API* (ts.factory). The typescript 7.x package is the native
      # port and ships no compiler API yet -- `ts.factory` is undefined, so the
      # generator dies and the api-schema job fails. openapi-typescript 7.13.0
      # (the latest) still declares `peerDependencies: typescript ^5.x`.
      # TS 7 also turns `strict` on by default, which tsconfig.app.json does
      # not set, so `tsc -b` fails on top of that. Lift this once
      # openapi-typescript supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Base image in the published container.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
