# Publish the server image to GitHub Container Registry.
#
# The deployment target is an unraid box (amd64), which pulls
# ghcr.io/enchantedrobot/jai-proxy:latest. Development on a Mac runs from
# source (`uv run python -m proxy.server`) rather than from this image, so
# there is no arm64 variant to build -- adding one means QEMU emulation on the
# runner and a several-times-slower build for an image nothing pulls.
#
# See docs/DEPLOY.md for the one-time steps this workflow deliberately does not
# automate (making the package public, seeding the data mount).

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # Lowercase: the registry rejects uppercase path components, and the owner is
  # spelled "EnchantedRobot".
  IMAGE_NAME: ghcr.io/enchantedrobot/jai-proxy

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only elevated permission needed. GITHUB_TOKEN carries it, so there
      # is no PAT to create, store as a secret, or rotate.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest tracks main (what unraid follows), :sha-<short> is the exact
          # rollback target for any build, and a v1.2.3 git tag additionally
          # publishes :1.2.3 and :1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls pngquant and re-resolves the whole
          # locked dependency set; with it, a change under proxy/ or web/ only
          # rebuilds the COPY layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
